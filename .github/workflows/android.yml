name: Android UIAutomator

on:
  push:
    paths: ['android/**']
  pull_request:
    paths: ['android/**']

jobs:
  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check for Android tests
        id: check
        run: |
          COUNT=$(find android/app/src/androidTest -name "*.kt" | wc -l)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Enable KVM
        if: steps.check.outputs.count > 0
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger

      - name: Cache Gradle
        if: steps.check.outputs.count > 0
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('android/**/*.gradle*') }}

      - name: Run Android tests
        if: steps.check.outputs.count > 0
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          script: ./gradlew connectedAndroidTest
        working-directory: android

      - name: No tests found
        if: steps.check.outputs.count == 0
        run: echo "No Android tests found yet, skipping."

      - uses: actions/upload-artifact@v4
        if: always() && steps.check.outputs.count > 0
        with:
          name: android-test-results
          path: android/app/build/reports/androidTests/
