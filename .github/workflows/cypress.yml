name: Cypress E2E

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  cypress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check for Cypress specs
        id: check
        run: |
          COUNT=$(find web/cypress/e2e -name "*.cy.ts" | wc -l)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Found $COUNT spec files"

      - name: Enable corepack and activate yarn
        if: steps.check.outputs.count > 0
        run: |
          corepack enable
          corepack prepare yarn@stable --activate

      - name: Install RWA dependencies
        if: steps.check.outputs.count > 0
        run: |
          cd apps/rwa
          yarn install --legacy-peer-deps

      - name: Start RWA
        if: steps.check.outputs.count > 0
        run: |
          cd apps/rwa
          yarn start &
        env:
          NODE_ENV: test
          PORT: 3000

      - name: Run Cypress
        if: steps.check.outputs.count > 0
        uses: cypress-io/github-action@v6
        with:
          working-directory: web/cypress
          browser: ${{ matrix.browser }}
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 180
        env:
          CYPRESS_BASE_URL: http://localhost:3000
          CYPRESS_RWA_USER: ${{ secrets.RWA_USER }}
          CYPRESS_RWA_PASS: ${{ secrets.RWA_PASS }}

      - name: No specs found
        if: steps.check.outputs.count == 0
        run: echo "No Cypress specs found yet, skipping."

      - uses: actions/upload-artifact@v4
        if: failure() && steps.check.outputs.count > 0
        with:
          name: cypress-screenshots-${{ matrix.browser }}
          path: web/cypress/cypress/screenshots/
